[package]
name = "rs-project"
version = "0.1.0"
edition = "2024"

# profile is optimized for speed
[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
# profile is optimized for size
#[profile.release]
#opt-level = "z"       # optimize for size, not speed (not opt-level = 3!)
#lto = true             # or "fat" — removes dead code across crates
panic = "abort"         # removes unwinding tables entirely
strip = true            # strips symbols/debug info
# profile is optimized for speed

[build]
rustflags = ["-C", "target-cpu=native"]
target-dir = "output"

[workspace]
resolver = "3"
members = ["game_of_life","langtons_ant"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
crossterm = "0.29.0"
rayon = "1.12.0"
fastrand = "2.5.0"

